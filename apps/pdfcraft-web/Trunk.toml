# Build with: trunk build --release   (from apps/pdfcraft-web)
# The release zip (packaging/web/package.sh) expects the site in dist/web with relative URLs.
[build]
target = "index.html"
dist = "../../dist/web"
public_url = "./"
filehash = true

[serve]
addresses = ["127.0.0.1"]
port = 8766

# 1) Hash OCR worker files and register <meta name="pdfcraft-ocr-worker"> in index.html
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["xtask", "web-worker-link"]

# 2) Strip debug sections from all .wasm files, and gzip+chunk main pdfcraft-web .wasm with progress bar
[[hooks]]
stage = "post_build"
command = "python3"
command_arguments = ["pack_wasm.py"]
